<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Software engineer. Days go into building things, evenings into music.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://tevfikkesici.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tevfikkesici.com/">
  <meta property="og:title" content="Tevfik Kesici">
  <meta property="og:description" content="Software engineer. Days go into building things, evenings into music.">
  <meta property="og:image" content="https://tevfikkesici.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tevfik Kesici, set above six guitar strings.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg?v=9" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=13">
  <script src="main.js?v=13" defer></script>
</head>
<body>
  <main class="page">
    <section class="intro">
      <h1>Tevfik Kesici</h1>
      <p class="lede">
        I'm a software engineer. Most of my days go into building things,
        most of my evenings go into music.
        <a href="https://7uner.com/" target="_blank" rel="noopener noreferrer">7uner</a>
        is where the two meet.
      </p>

      <ul class="links">
        <li>
          <a href="https://7uner.com/" target="_blank" rel="noopener noreferrer">
            <span class="name">7uner</span>
            <span class="what">Tuner, practice room and tab player. Runs in your browser.</span>
            <span class="arrow" aria-hidden="true">&#8599;</span>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/tevfik-kesici-541a07127/" target="_blank" rel="noopener noreferrer">
            <span class="name">LinkedIn</span>
            <span class="what">The work side of things.</span>
            <span class="arrow" aria-hidden="true">&#8599;</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="play" aria-label="Six guitar strings">
      <div class="play-head">
        <div class="game">
          <button id="game" type="button">
            <svg class="busker" viewBox="0 0 64 72" aria-hidden="true" focusable="false">
              <g class="notes" fill="currentColor">
                <path class="note n1" d="M47 14v-6.5l4-1v1.6l-2.8.7V14a1.6 1.3 0 1 1-1.2-1.3z"/>
                <path class="note n2" d="M52 18v-5.5l3.6-.9v5.4a1.5 1.2 0 1 1-1-1.2v-2.4l-1.6.4V18a1.5 1.2 0 1 1-1-1.2z"/>
              </g>
              <g class="body">
                <g class="legs" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M28 37.5 26 51.5h-3"/>
                  <path class="foot" d="M32 37.5 34 51.5h3.2"/>
                </g>
                <path class="shirt" fill="currentColor" d="M24.6 21.4h10.8l2.6 4.6-2.6 1.2-.8 10.8h-9.2l-.8-10.8-2.6-1.2z"/>
                <g class="head">
                  <path d="M30 19.6v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <circle cx="30" cy="13" r="6.4" class="paper" stroke="currentColor" stroke-width="1.5"/>
                  <path class="beard" fill="currentColor" d="M23.9 15.1a6.4 6.4 0 0 0 12.2 0c-.9 2.1-2.5 3.2-4.2 2.8-.9-.5-2.9-.5-3.8 0-1.7.4-3.3-.7-4.2-2.8z"/>
                  <path class="hair" fill="currentColor" d="M23.2 14.2C21.6 10.4 22 6.2 24.6 3.8 26.4 1.6 29.6.6 32.4 1.2c3.2-.4 6.4 1.4 7.2 4.2 1.8.8 2 3.4.6 4.8-.4 1.4-1.8 2.4-3.2 2.2-.4-1.8-1.6-3-3.2-3.4-1.6.8-3.4.6-4.8-.2-1 1.4-2.4 2.2-3.8 2-.4 1.2-1 2.6-2 3.4z"/>
                  <path fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round" d="M25 3.4c-1-.9-1.1-2.2-.3-3M30.8 1.2c.2-1 1-1.6 2-1.6M37.8 2.7c1-.3 1.9.1 2.3 1M40.9 7.4c.9.2 1.4.9 1.3 1.8"/>
                  <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M26.3 12h2.6M31.3 12h2.6"/>
                  <circle cx="27.7" cy="13.8" r=".65" fill="currentColor"/>
                  <circle cx="32.6" cy="13.8" r=".65" fill="currentColor"/>
                </g>
                <g class="guitar" transform="translate(25.5 33) rotate(-24)">
                  <path d="M10.5 0h17" stroke="currentColor" stroke-width="2.2"/>
                  <rect x="27" y="-1.9" width="4.6" height="3.8" rx=".8" fill="currentColor"/>
                  <circle cx="7.4" cy="0" r="4.4" class="paper" stroke="currentColor" stroke-width="1.3"/>
                  <circle cx="0" cy="0" r="5.8" class="paper" stroke="currentColor" stroke-width="1.3"/>
                  <circle cx="7.4" cy="0" r="3.75" class="paper"/>
                  <circle cx="5.2" cy="0" r="1.6" fill="currentColor"/>
                  <path d="M-3.2 -1.4v2.8" stroke="currentColor" stroke-width="1"/>
                  <path d="M-3.2 0H27" stroke="currentColor" stroke-width=".3" stroke-opacity=".6"/>
                </g>
                <path class="fret-arm" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M35.4 22.6 40.2 30l4.2-5.6"/>
                <path class="strum" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M24.6 22.6 20.4 29.4l8.2 2.6"/>
              </g>
            </svg>
            <span class="label">Play me something</span>
          </button>
        </div>
      </div>
      <div class="stage">
        <canvas id="strings" role="img"
          aria-label="Six guitar strings. Strum them with the mouse or by touch, or press keys 1 to 6."></canvas>
      </div>
    </section>
  </main>
</body>
</html>
