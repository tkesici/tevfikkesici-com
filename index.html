<body>
  <main class="page">
    <section class="intro">
      <h1>Tevfik Kesici</h1>
      <p class="lede">
        I'm a software engineer. Most of my days go into building things,
        most of my evenings go into music.
        <a href="https://7uner.com/" target="_blank" rel="noopener noreferrer">7uner</a>
        is where the two meet.
      </p>

      <ul class="links">
        <li>
          <a href="https://7uner.com/" target="_blank" rel="noopener noreferrer">
            <span class="name">7uner</span>
            <span class="what">Tuner, practice room and tab player. Runs in your browser.</span>
            <span class="arrow" aria-hidden="true">&#8599;</span>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/tevfik-kesici-541a07127/" target="_blank" rel="noopener noreferrer">
            <span class="name">LinkedIn</span>
            <span class="what">The work side of things.</span>
            <span class="arrow" aria-hidden="true">&#8599;</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="play" aria-label="Six guitar strings">
      <div class="play-head">
        <div class="game">
          <button id="game" type="button">
            <svg class="busker" viewBox="0 0 64 72" aria-hidden="true" focusable="false">
              <g class="notes" fill="currentColor">
                <path class="note n1" d="M48 12v-6.5l4-1v1.6l-2.8.7V12a1.6 1.3 0 1 1-1.2-1.3z"/>
                <path class="note n2" d="M53 16.5V11l3.6-.9v5.4a1.5 1.2 0 1 1-1-1.2v-2.4l-1.6.4v4.2a1.5 1.2 0 1 1-1-1.2z"/>
              </g>
              <g class="chair" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M38.5 24.5v37.5M26 42.5h12.5M27.5 42.5V62" stroke-width="1.5"/>
                <path d="M10 62.5h32" stroke-width=".8" stroke-opacity=".35"/>
              </g>
              <g class="legs" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M31 41.5 22.5 42.6 23.2 56h-3.4"/>
                <path class="foot" d="M28.5 41 19 41.4v14.4h-3.6"/>
              </g>
              <path class="shirt" fill="currentColor" d="M24.6 21.4h10.8l2.6 4.6-2.6 1.2-.6 14.6h-9.6l-.6-14.6-2.6-1.2z"/>
              <g class="head">
                <path d="M30 19.6v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path class="paper" stroke="currentColor" stroke-width="1" d="M23.5 13.6a1.3 1.8 0 1 0 0 .1M36.5 13.6a1.3 1.8 0 1 1 0 .1"/>
                <circle class="paper" cx="30" cy="13" r="6.4" stroke="currentColor" stroke-width="1.5"/>
                <path class="hair" fill="currentColor" d="M23.8 12.2c-.6-4 1-7.4 4.4-8.6.8-.7 1.8-.9 2.6-.6.9-.6 2-.5 2.7.1 1.3 0 2.6.6 3.3 1.9 1.4 1.2 1.4 4-.4 6.2-.6-2-2-3.2-4-3.4-2 .4-4.6.2-6 .8-1 .8-1.8 1.8-2.6 3z"/>
                <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M26.2 11.4l2.8-.3M31 11.1l2.8.3"/>
                <circle cx="27.7" cy="13.3" r=".65" fill="currentColor"/>
                <circle cx="32.4" cy="13.3" r=".65" fill="currentColor"/>
                <path fill="none" stroke="currentColor" stroke-width=".7" stroke-linecap="round" d="M30.2 13.6l-.4 2.4h.9M28.6 17.6h2.8"/>
              </g>
              <g class="guitar" transform="translate(22.5 35.5) rotate(-22)">
                <rect class="paper" x="10" y="-1.35" width="17.2" height="2.7" stroke="currentColor" stroke-width=".55"/>
                <path d="M12.6-1.35v2.7M15-1.35v2.7M17.3-1.35v2.7M19.4-1.35v2.7M21.4-1.35v2.7M23.3-1.35v2.7M25.1-1.35v2.7" stroke="currentColor" stroke-width=".25"/>
                <path d="M27.2-1.9h4.6l.6.9v1.9l-.6.9h-4.6z" fill="currentColor"/>
                <circle class="paper" cx="7.2" cy="0" r="4.5" stroke="currentColor" stroke-width="1.2"/>
                <circle class="paper" cx="0" cy="0" r="5.9" stroke="currentColor" stroke-width="1.2"/>
                <circle class="paper" cx="7.2" cy="0" r="3.9"/>
                <circle cx="5" cy="0" r="1.6" fill="currentColor"/>
                <path d="M-3.4-1.6v3.2" stroke="currentColor" stroke-width="1"/>
                <path class="strings" fill="none" stroke="currentColor" stroke-width=".14" d="M-3.4-1h30.6M-3.4-.6h30.6M-3.4-.2h30.6M-3.4.2h30.6M-3.4.6h30.6M-3.4 1h30.6"/>
              </g>
              <path class="fret-arm" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M35.4 22.6 39.6 31.6l3.8-4.6"/>
              <path class="strum" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M24.6 22.6 19.6 30.2l7.8 2.4"/>
            </svg>
            <span class="label">Play me something</span>
          </button>
        </div>
      </div>
      <div class="stage">
        <canvas id="strings" role="img"
          aria-label="Six guitar strings. Strum them with the mouse or by touch, or press keys 1 to 6."></canvas>
      </div>
    </section>
  </main>
